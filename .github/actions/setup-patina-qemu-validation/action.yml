name: Setup Patina QEMU Validation

description: >-
  Clone dependency repos into caller-specified directories, build
  patina-dxe-core-qemu with a crate patch, and sparse-checkout the
  patina-qemu run script.  Every path is supplied by the caller — this
  action never assumes where anything lives.

inputs:
  patina-repo:
    description: Absolute path to the patina repository root (used for crate patch).
    required: true
  deps-dir:
    description: Absolute path to the parent directory for cloned dependency repos.
    required: true
  dxe-core-qemu-repo:
    description: Absolute path where patina-dxe-core-qemu should be cloned.
    required: true
  fw-patcher-repo:
    description: Absolute path where patina-fw-patcher should be cloned.
    required: true
  patina-qemu-repo:
    description: Absolute path where patina-qemu should be sparse-cloned.
    required: true
  log-file:
    description: >-
      Absolute path to a log file. When set, build output is teed to this
      file so that it is available as an artifact even when the build fails.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: '[DEBUG] Dump all input paths'
      shell: bash
      run: |
        echo "========== SETUP ACTION - INPUT PATHS =========="
        echo "patina-repo:        ${{ inputs.patina-repo }}"
        echo "deps-dir:           ${{ inputs.deps-dir }}"
        echo "dxe-core-qemu-repo: ${{ inputs.dxe-core-qemu-repo }}"
        echo "fw-patcher-repo:    ${{ inputs.fw-patcher-repo }}"
        echo "patina-qemu-repo:   ${{ inputs.patina-qemu-repo }}"
        echo "log-file:           ${{ inputs.log-file }}"
        echo ""
        echo "--- patina-repo existence check ---"
        echo "  Exists?  $(test -d '${{ inputs.patina-repo }}' && echo YES || echo NO)"
        echo "  Cargo.toml? $(test -f '${{ inputs.patina-repo }}/Cargo.toml' && echo YES || echo NO)"
        echo ""
        echo "--- patina-repo listing (top-level) ---"
        ls -la '${{ inputs.patina-repo }}/' 2>&1 || echo '  (directory does not exist)'
        echo ""
        echo "--- pwd ---"
        pwd
        echo ""
        echo "--- GITHUB_WORKSPACE ---"
        echo "$GITHUB_WORKSPACE"
        echo ""
        echo "--- ls GITHUB_WORKSPACE ---"
        ls -la "$GITHUB_WORKSPACE/" 2>&1 || echo '  (directory does not exist)'
        echo ""
        echo "--- ls GITHUB_WORKSPACE/.. ---"
        ls -la "$GITHUB_WORKSPACE/../" 2>&1 || echo '  (parent does not exist)'
        echo ""
        echo "--- /home/runner/work layout (3 levels) ---"
        find /home/runner/work -maxdepth 3 -type f -name 'Cargo.toml' 2>/dev/null || echo '  (no Cargo.toml found)'
        echo "================================================"

    - name: Clone patina-dxe-core-qemu
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "${{ inputs.dxe-core-qemu-repo }}" ]; then
          git clone https://github.com/OpenDevicePartnership/patina-dxe-core-qemu.git \
            "${{ inputs.dxe-core-qemu-repo }}"
        fi

    - name: '[DEBUG] Post-clone patina-dxe-core-qemu'
      shell: bash
      run: |
        echo "--- dxe-core-qemu-repo: ${{ inputs.dxe-core-qemu-repo }} ---"
        echo "  exists? $(test -d '${{ inputs.dxe-core-qemu-repo }}' && echo YES || echo NO)"
        echo "  Cargo.toml? $(test -f '${{ inputs.dxe-core-qemu-repo }}/Cargo.toml' && echo YES || echo NO)"
        ls -la '${{ inputs.dxe-core-qemu-repo }}/' 2>&1 || echo '  (missing)'
        echo ""
        echo "--- deps-dir: ${{ inputs.deps-dir }} ---"
        ls -la '${{ inputs.deps-dir }}/' 2>&1 || echo '  (missing)'

    - name: Clone patina-fw-patcher
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "${{ inputs.fw-patcher-repo }}" ]; then
          git clone https://github.com/OpenDevicePartnership/patina-fw-patcher.git \
            "${{ inputs.fw-patcher-repo }}"
        fi
        chmod +x "${{ inputs.fw-patcher-repo }}/Executables/"*

    - name: '[DEBUG] Post-clone patina-fw-patcher'
      shell: bash
      run: |
        echo "--- fw-patcher-repo: ${{ inputs.fw-patcher-repo }} ---"
        echo "  exists? $(test -d '${{ inputs.fw-patcher-repo }}' && echo YES || echo NO)"
        ls -la '${{ inputs.fw-patcher-repo }}/' 2>&1 || echo '  (missing)'
        ls -la '${{ inputs.fw-patcher-repo }}/Executables/' 2>&1 || echo '  Executables/ missing'

    - name: Sparse-checkout patina-qemu build script
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "${{ inputs.patina-qemu-repo }}" ]; then
          git clone --filter=blob:none --sparse --depth=1 \
            --branch build_and_run_script_automation_updates \
            https://github.com/makubacki/patina-qemu.git \
            "${{ inputs.patina-qemu-repo }}"
          cd "${{ inputs.patina-qemu-repo }}"
          # MSYS_NO_PATHCONV prevents Git Bash (MSYS2) on Windows from
          # converting the leading '/' in sparse-checkout patterns into
          # Windows paths (e.g. C:/build_and_run_rust_binary.py).  The
          # variable is harmless on Linux.
          MSYS_NO_PATHCONV=1 git sparse-checkout set --no-cone /build_and_run_rust_binary.py /Platforms/Common/Qemu
        fi

    - name: '[DEBUG] Post-clone patina-qemu'
      shell: bash
      run: |
        echo "--- patina-qemu-repo: ${{ inputs.patina-qemu-repo }} ---"
        echo "  exists? $(test -d '${{ inputs.patina-qemu-repo }}' && echo YES || echo NO)"
        echo "  build_and_run_rust_binary.py? $(test -f '${{ inputs.patina-qemu-repo }}/build_and_run_rust_binary.py' && echo YES || echo NO)"
        ls -la '${{ inputs.patina-qemu-repo }}/' 2>&1 || echo '  (missing)'
        echo ""
        echo "--- Full deps-dir listing ---"
        ls -laR '${{ inputs.deps-dir }}/' 2>&1 | head -50 || echo '  (missing)'

    - name: Build patina-dxe-core-qemu with PR Changes
      shell: bash
      env:
        BUILD_LOG_FILE: ${{ inputs.log-file }}
      run: |
        set -euo pipefail

        # Ensure the log directory exists before tee attempts to write.
        if [ -n "$BUILD_LOG_FILE" ]; then
          mkdir -p "$(dirname "$BUILD_LOG_FILE")"
        fi

        # When a log file is configured, tee stdout+stderr to it so the
        # build output is captured in the artifact even on failure.
        run_cmd() {
          if [ -n "$BUILD_LOG_FILE" ]; then
            "$@" 2>&1 | tee -a "$BUILD_LOG_FILE"
          else
            "$@"
          fi
        }

        cd "${{ inputs.dxe-core-qemu-repo }}"

        echo "========== PRE-BUILD DEBUG =========="
        echo "cwd: $(pwd)"
        echo "dxe-core-qemu Cargo.toml exists? $(test -f Cargo.toml && echo YES || echo NO)"
        ls -la
        echo ""
        echo "patina-repo path: ${{ inputs.patina-repo }}"
        echo "patina-repo Cargo.toml exists? $(test -f '${{ inputs.patina-repo }}/Cargo.toml' && echo YES || echo NO)"
        ls -la '${{ inputs.patina-repo }}/' 2>&1 || echo '  (patina-repo dir missing)'
        echo ""
        echo "--- Searching for ALL Cargo.toml files under /home/runner/work ---"
        find /home/runner/work -name 'Cargo.toml' 2>/dev/null || echo '  (none found)'
        echo "====================================="

        run_cmd rustup component add rust-src
        run_cmd cargo make q35 -- --crate-patch "${{ inputs.patina-repo }}" --leave-patch
        run_cmd cargo make q35-release
        run_cmd cargo make sbsa
        run_cmd cargo make sbsa-release
