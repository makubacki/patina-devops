name: Setup Patina QEMU Validation

description: Clone dependencies, build patina-dxe-core-qemu with crate patch, and sparse-checkout the patina-qemu run script and its dependencies.

inputs:
  patina-repo-path:
    description: Path to the patina repository root to use for crate patch.
    required: false
    default: ${{ github.workspace }}
  log-file:
    description: >-
      Optional absolute path to a log file. When set, build output is
      teed to this file so that it is available as an artifact even when
      the build fails.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Clone Dependencies
      shell: bash
      run: |
        set -euo pipefail
        # Clone outside the patina workspace to avoid Cargo workspace conflicts
        cd ..
        if [ ! -d "patina-dxe-core-qemu" ]; then
          git clone https://github.com/OpenDevicePartnership/patina-dxe-core-qemu.git
        fi
        if [ ! -d "patina-fw-patcher" ]; then
          git clone https://github.com/OpenDevicePartnership/patina-fw-patcher.git
        fi
        chmod +x patina-fw-patcher/Executables/*

    - name: Fetch Patina QEMU Build and Patch Script
      shell: bash
      run: |
        set -euo pipefail
        cd ..
        if [ ! -d "patina-qemu" ]; then
          git clone --filter=blob:none --sparse --depth=1 --branch build_and_run_script_automation_updates https://github.com/makubacki/patina-qemu.git
          cd patina-qemu
          git sparse-checkout set --no-cone /build_and_run_rust_binary.py /Platforms/Common/Qemu
        fi

    - name: Build patina-dxe-core-qemu with PR Changes
      shell: bash
      env:
        BUILD_LOG_FILE: ${{ inputs.log-file }}
      run: |
        set -euo pipefail

        # When a log file is configured, tee stdout+stderr to it so the
        # build output is captured in the artifact even on failure.
        run_cmd() {
          if [ -n "$BUILD_LOG_FILE" ]; then
            "$@" 2>&1 | tee -a "$BUILD_LOG_FILE"
          else
            "$@"
          fi
        }

        cd ../patina-dxe-core-qemu
        run_cmd rustup component add rust-src
        run_cmd cargo make q35 -- --crate-patch "${{ inputs.patina-repo-path }}" --leave-patch
        run_cmd cargo make q35-release
        run_cmd cargo make sbsa
        run_cmd cargo make sbsa-release
