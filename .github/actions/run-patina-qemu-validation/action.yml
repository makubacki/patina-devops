name: Run Patina QEMU Validation

description: >-
  Runs build_and_run_rust_binary.py routing stdout exclusively to a log file
  and stderr to both the log file and the console. Works on Linux and Windows.
  All paths are supplied by the caller — this action never assumes where
  anything lives.

inputs:
  patina-qemu-repo:
    description: Absolute path to the patina-qemu repository containing build_and_run_rust_binary.py.
    required: true
  patina-dxe-core-repo:
    description: Absolute path to the patina-dxe-core-qemu repository.
    required: true
  fw-patch-repo:
    description: Absolute path to the patina-fw-patcher repository.
    required: true
  pre-compiled-rom:
    description: Absolute path to the pre-compiled firmware ROM file.
    required: true
  build-target:
    description: Build target (e.g. DEBUG or RELEASE).
    required: false
    default: DEBUG
  toolchain:
    description: Rust toolchain tag.
    required: true
  platform:
    description: QEMU platform name (e.g. Q35 or SBSA).
    required: true
  log-file:
    description: Absolute path to the output log file.
    required: true
  qemu-path:
    description: Path to the QEMU executable directory (Windows only).
    required: false
    default: ''
  no-build:
    description: Skip building the firmware ('true' or 'false').
    required: false
    default: 'false'
  shutdown-after-run:
    description: Shut down QEMU after running ('true' or 'false').
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: '[DEBUG] Dump run-validation input paths'
      shell: bash
      run: |
        echo "========== RUN-VALIDATION ACTION - INPUT PATHS =========="
        echo "patina-qemu-repo:    ${{ inputs.patina-qemu-repo }}"
        echo "patina-dxe-core-repo: ${{ inputs.patina-dxe-core-repo }}"
        echo "fw-patch-repo:       ${{ inputs.fw-patch-repo }}"
        echo "pre-compiled-rom:    ${{ inputs.pre-compiled-rom }}"
        echo "build-target:        ${{ inputs.build-target }}"
        echo "toolchain:           ${{ inputs.toolchain }}"
        echo "platform:            ${{ inputs.platform }}"
        echo "log-file:            ${{ inputs.log-file }}"
        echo "qemu-path:           ${{ inputs.qemu-path }}"
        echo "headless:            true (hardcoded)"
        echo "no-build:            ${{ inputs.no-build }}"
        echo "shutdown-after-run:  ${{ inputs.shutdown-after-run }}"
        echo ""
        echo "--- patina-qemu-repo exists? ---"
        test -d '${{ inputs.patina-qemu-repo }}' && echo YES || echo NO
        echo "--- build_and_run_rust_binary.py exists? ---"
        test -f '${{ inputs.patina-qemu-repo }}/build_and_run_rust_binary.py' && echo YES || echo NO
        echo "--- patina-dxe-core-repo exists? ---"
        test -d '${{ inputs.patina-dxe-core-repo }}' && echo YES || echo NO
        echo "--- fw-patch-repo exists? ---"
        test -d '${{ inputs.fw-patch-repo }}' && echo YES || echo NO
        echo "--- pre-compiled-rom exists? ---"
        test -f '${{ inputs.pre-compiled-rom }}' && echo YES || echo NO
        echo ""
        echo "--- patina-qemu-repo listing ---"
        ls -la '${{ inputs.patina-qemu-repo }}/' 2>&1 || echo '  (does not exist)'
        echo ""
        echo "--- patina-dxe-core-repo listing ---"
        ls -la '${{ inputs.patina-dxe-core-repo }}/' 2>&1 || echo '  (does not exist)'
        echo ""
        echo "--- fw-patch-repo listing ---"
        ls -la '${{ inputs.fw-patch-repo }}/' 2>&1 || echo '  (does not exist)'
        echo ""
        echo "--- github.action_path ---"
        echo "${{ github.action_path }}"
        ls -la "${{ github.action_path }}/" 2>&1 || echo '  (does not exist)'
        echo "======================================================="

    - name: Run build_and_run_rust_binary.py (Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        python3 "${{ github.action_path }}/run_qemu_validation.py" \
          --patina-qemu-repo "${{ inputs.patina-qemu-repo }}" \
          --patina-dxe-core-repo "${{ inputs.patina-dxe-core-repo }}" \
          --fw-patch-repo "${{ inputs.fw-patch-repo }}" \
          --pre-compiled-rom "${{ inputs.pre-compiled-rom }}" \
          --build-target "${{ inputs.build-target }}" \
          --toolchain "${{ inputs.toolchain }}" \
          --platform "${{ inputs.platform }}" \
          --log-file "${{ inputs.log-file }}" \
          --headless \
          ${{ inputs.no-build == 'true' && '--no-build' || '' }} \
          ${{ inputs.shutdown-after-run == 'true' && '--shutdown-after-run' || '' }}

    - name: Run build_and_run_rust_binary.py (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        python "${{ github.action_path }}/run_qemu_validation.py" `
          --patina-qemu-repo "${{ inputs.patina-qemu-repo }}" `
          --patina-dxe-core-repo "${{ inputs.patina-dxe-core-repo }}" `
          --fw-patch-repo "${{ inputs.fw-patch-repo }}" `
          --pre-compiled-rom "${{ inputs.pre-compiled-rom }}" `
          --build-target "${{ inputs.build-target }}" `
          --toolchain "${{ inputs.toolchain }}" `
          --platform "${{ inputs.platform }}" `
          --log-file "${{ inputs.log-file }}" `
          --qemu-path "${{ inputs.qemu-path }}" `
          --headless `
          ${{ inputs.no-build == 'true' && '--no-build' || '' }} `
          ${{ inputs.shutdown-after-run == 'true' && '--shutdown-after-run' || '' }}
