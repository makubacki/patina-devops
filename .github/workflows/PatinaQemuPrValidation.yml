# A reusable workflow that builds patina-dxe-core-qemu against the current PR head
# and validates boot on QEMU.
#
# Copyright (c) Microsoft Corporation.
# SPDX-License-Identifier: Apache-2.0
##
name: Patina QEMU PR Validation

on:
  workflow_call:
    inputs:
      pr-number:
        description: "Pull request number in the caller repository"
        required: true
        type: number
      patina-ref:
        description: "Commit/branch/tag to checkout in patina"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  vars:
    name: Get Constants
    uses: makubacki/patina-devops/.github/workflows/qemu-constants.yml@patina_plat_testing

  readiness:
    name: Check Readiness
    runs-on: ubuntu-latest
    outputs:
      patina_local_version: ${{ steps.compare.outputs.patina_local_version }}
      patina_local_major: ${{ steps.compare.outputs.patina_local_major }}
      patina_latest_tag: ${{ steps.compare.outputs.patina_latest_tag }}
      patina_latest_major_tag: ${{ steps.compare.outputs.patina_latest_major_tag }}
      patina_dxe_core_qemu_dep_version: ${{ steps.compare.outputs.patina_dxe_core_qemu_dep_version }}
      patina_dxe_core_qemu_dep_major: ${{ steps.compare.outputs.patina_dxe_core_qemu_dep_major }}
      mismatch: ${{ steps.compare.outputs.mismatch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: OpenDevicePartnership/patina
          ref: ${{ inputs.patina-ref }}

      - name: Check Major Version Compatibility
        id: compare
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib
          import urllib.request

          # Get the major version in Cargo.toml in the patina repo
          patina_cargo_toml_text = pathlib.Path('Cargo.toml').read_text(encoding='utf-8')
          patina_cargo_data = tomllib.loads(patina_cargo_toml_text)
          patina_local_version = patina_cargo_data['workspace']['package']['version']
          patina_local_major = int(patina_local_version.split('.')[0])

          # Get the major version from the latest GitHub release in the patina repo
          with urllib.request.urlopen('https://api.github.com/repos/OpenDevicePartnership/patina/releases/latest') as response:
              patina_latest_gh_release = json.loads(response.read().decode('utf-8'))

          patina_latest_tag = patina_latest_gh_release['tag_name']
          patina_latest_major_tag_match = re.search(r'(\d+)', patina_latest_tag)

          if patina_latest_major_tag_match is None:
              raise SystemExit(f'Unable to parse latest release major from tag: {patina_latest_tag}')

          patina_latest_major_tag = int(patina_latest_major_tag_match.group(1))

          # Get the major version in Cargo.toml in patina-dxe-core-qemu/main
          with urllib.request.urlopen('https://raw.githubusercontent.com/OpenDevicePartnership/patina-dxe-core-qemu/refs/heads/main/Cargo.toml') as response:
              patina_dxe_core_qemu_cargo_text = response.read().decode('utf-8')

          patina_dxe_core_qemu_cargo_toml = tomllib.loads(patina_dxe_core_qemu_cargo_text)

          patina_dxe_core_qemu_dep = None
          if 'dependencies' in patina_dxe_core_qemu_cargo_toml and 'patina' in patina_dxe_core_qemu_cargo_toml['dependencies']:
              patina_dxe_core_qemu_dep = patina_dxe_core_qemu_cargo_toml['dependencies']['patina']
          else:
              raise SystemExit('Unable to locate the patina crate dependency in patina-dxe-core-qemu Cargo.toml')

          if isinstance(patina_dxe_core_qemu_dep, str):
              patina_dxe_core_qemu_dep_version = patina_dxe_core_qemu_dep
          elif isinstance(patina_dxe_core_qemu_dep, dict):
              patina_dxe_core_qemu_dep_version = patina_dxe_core_qemu_dep.get('version', '')
          else:
              patina_dxe_core_qemu_dep_version = ''

          dep_major_match = re.search(r'(\d+)', patina_dxe_core_qemu_dep_version)
          if dep_major_match is None:
              raise SystemExit(f'Unable to parse patina dependency major ver from: {patina_dxe_core_qemu_dep_version}')
          patina_dxe_core_qemu_dep_major = int(dep_major_match.group(1))

          mismatch = patina_local_major != patina_dxe_core_qemu_dep_major
          output_file = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output_file.open('a', encoding='utf-8') as out:
              out.write(f'patina_local_version={patina_local_version}\n')
              out.write(f'patina_local_major={patina_local_major}\n')
              out.write(f'patina_latest_tag={patina_latest_tag}\n')
              out.write(f'patina_latest_major_tag={patina_latest_major_tag}\n')
              out.write(f'patina_dxe_core_qemu_dep_version={patina_dxe_core_qemu_dep_version}\n')
              out.write(f'patina_dxe_core_qemu_dep_major={patina_dxe_core_qemu_dep_major}\n')
              out.write(f'mismatch={str(mismatch).lower()}\n')
          PY

      - name: Fail Due to Major Version Mismatch
        if: steps.compare.outputs.mismatch == 'true'
        shell: bash
        run: |
          echo "Patina QEMU validation failed due to major version mismatch in patina and patina-dxe-core-qemu."
          exit 1

  release-assets:
    name: Identify Latest patina-qemu FW Release Binaries
    runs-on: ubuntu-latest
    needs: [readiness]
    outputs:
      tag: ${{ steps.patina-qemu-release-assets.outputs.tag }}
      q35_url: ${{ steps.patina-qemu-release-assets.outputs.q35_url }}
      sbsa_url: ${{ steps.patina-qemu-release-assets.outputs.sbsa_url }}
    steps:
      - name: Identify Latest patina-qemu FW Release Binaries
        id: patina-qemu-release-assets
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          with urllib.request.urlopen('https://api.github.com/repos/OpenDevicePartnership/patina-qemu/releases/latest') as response:
              release = json.loads(response.read().decode('utf-8'))

          tag = release['tag_name']
          q35_name = f'patina-qemu-q35-{tag}.zip'
          sbsa_name = f'patina-qemu-sbsa-{tag}.zip'

          assets = {asset['name']: asset['browser_download_url'] for asset in release.get('assets', [])}
          if q35_name not in assets:
              raise SystemExit(f'Missing expected Q35 firmware asset: {q35_name}')
          if sbsa_name not in assets:
              raise SystemExit(f'Missing expected SBSA firmware asset: {sbsa_name}')

          output_file = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output_file.open('a', encoding='utf-8') as out:
              out.write(f'tag={tag}\n')
              out.write(f'q35_url={assets[q35_name]}\n')
              out.write(f'sbsa_url={assets[sbsa_name]}\n')
          PY

  validate-qemu-linux:
    name: Validate QEMU - ${{ matrix.platform }} (Linux)
    runs-on: ubuntu-latest
    needs: [vars, readiness, release-assets]
    container:
      image: ${{ needs.vars.outputs['container-image'] }}
      volumes:
        - /home/runner/work/_actions:/home/runner/work/_actions

    # -------------------------------------------------------------------
    # Directory layout (all absolute, all defined here):
    #
    #   PATINA_REPO           - patina source (checkout target = workspace)
    #   DEPS_DIR              - parent for cloned dependency repos
    #   DXE_CORE_QEMU_REPO    - patina-dxe-core-qemu clone
    #   FW_PATCHER_REPO       - patina-fw-patcher clone
    #   PATINA_QEMU_REPO      - patina-qemu sparse clone
    #   FW_DIR                - extracted pre-compiled firmware
    #   LOG_DIR               - build & QEMU log output
    # -------------------------------------------------------------------
    env:
      PATINA_REPO:         ${{ github.workspace }}
      DEPS_DIR:            ${{ github.workspace }}/../deps
      DXE_CORE_QEMU_REPO:  ${{ github.workspace }}/../deps/patina-dxe-core-qemu
      FW_PATCHER_REPO:     ${{ github.workspace }}/../deps/patina-fw-patcher
      PATINA_QEMU_REPO:    ${{ github.workspace }}/../deps/patina-qemu
      FW_DIR:              ${{ github.workspace }}/firmware
      LOG_DIR:             ${{ github.workspace }}/logs

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Q35
            fw_zip: q35.zip
            fw_cache_key_suffix: q35
            rom_subpath: Q35/DEBUG-GCC5/QEMUQ35_CODE.fd
            log_file: q35-linux.log
          - platform: SBSA
            fw_zip: sbsa.zip
            fw_cache_key_suffix: sbsa
            rom_subpath: SBSA/DEBUG-GCC5/QEMU_EFI.fd
            log_file: sbsa-linux.log

    steps:
      - name: Checkout patina
        uses: actions/checkout@v6
        with:
          repository: OpenDevicePartnership/patina
          ref: ${{ inputs.patina-ref }}

      - name: '[DEBUG] Post-checkout path dump (Linux)'
        shell: bash
        run: |
          echo "========== LINUX POST-CHECKOUT DEBUG =========="
          echo "github.workspace = ${{ github.workspace }}"
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          echo "pwd              = $(pwd)"
          echo "PATINA_REPO      = $PATINA_REPO"
          echo "DEPS_DIR         = $DEPS_DIR"
          echo "DXE_CORE_QEMU_REPO = $DXE_CORE_QEMU_REPO"
          echo "FW_PATCHER_REPO  = $FW_PATCHER_REPO"
          echo "PATINA_QEMU_REPO = $PATINA_QEMU_REPO"
          echo "FW_DIR           = $FW_DIR"
          echo "LOG_DIR          = $LOG_DIR"
          echo ""
          echo "--- Cargo.toml in PATINA_REPO? ---"
          test -f "$PATINA_REPO/Cargo.toml" && echo "YES" || echo "NO"
          echo ""
          echo "--- ls PATINA_REPO (top-level) ---"
          ls -la "$PATINA_REPO/" 2>&1 || echo '  (does not exist)'
          echo ""
          echo "--- ls github.workspace (top-level) ---"
          ls -la "$GITHUB_WORKSPACE/" 2>&1 || echo '  (does not exist)'
          echo ""
          echo "--- ls pwd (top-level) ---"
          ls -la
          echo ""
          echo "--- Cargo.toml search under /home/runner/work ---"
          find /home/runner/work -maxdepth 4 -name 'Cargo.toml' 2>/dev/null || echo '  (none found)'
          echo ""
          echo "--- Container info ---"
          cat /etc/os-release 2>/dev/null | head -5 || true
          echo "================================================"

      - name: Create directories
        shell: bash
        run: |
          mkdir -p "$DEPS_DIR"
          mkdir -p "$FW_DIR"
          mkdir -p "$LOG_DIR"

      - name: Setup Python (Linux)
        shell: bash
        run: python3 --version

      - name: Download Rust tools
        uses: makubacki/patina-devops/.github/actions/rust-tool-cache@patina_plat_testing

      - name: '[DEBUG] Post Rust tool cache (Linux)'
        shell: bash
        run: |
          echo "========== POST RUST TOOL CACHE (Linux) =========="
          echo "rustup home:       $(rustup show home 2>/dev/null || echo 'N/A')"
          echo "cargo home:        ${CARGO_HOME:-~/.cargo}"
          echo "rustup toolchain:  $(rustup show active-toolchain 2>/dev/null || echo 'N/A')"
          echo "cargo:             $(which cargo 2>/dev/null || echo 'N/A')"
          echo "cargo-make:        $(which cargo-make 2>/dev/null || echo 'N/A')"
          echo "cargo version:     $(cargo --version 2>/dev/null || echo 'N/A')"
          echo ""
          echo "--- pwd ---"
          pwd
          echo "--- PATINA_REPO still intact? ---"
          echo "  Cargo.toml? $(test -f '$PATINA_REPO/Cargo.toml' && echo YES || echo NO)"
          ls -la "$PATINA_REPO/" 2>&1 | head -20 || echo '  (missing)'
          echo "================================================"

      - name: Check Cache For patina-qemu FW Binary
        id: firmware-cache
        uses: actions/cache@v5
        with:
          path: .cache/patina-qemu/${{ matrix.fw_zip }}
          key: patina-qemu-fw-${{ matrix.fw_cache_key_suffix }}-${{ runner.os }}-${{ needs.release-assets.outputs.tag }}

      - name: Download patina-qemu FW binary
        if: steps.firmware-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FW_URL: ${{ matrix.platform == 'Q35' && needs.release-assets.outputs.q35_url || needs.release-assets.outputs.sbsa_url }}
        run: |
          mkdir -p .cache/patina-qemu
          curl -L "$FW_URL" -o .cache/patina-qemu/${{ matrix.fw_zip }}

      - name: Extract patina-qemu FW binary
        shell: bash
        run: unzip -o .cache/patina-qemu/${{ matrix.fw_zip }} -d "$FW_DIR"

      - name: '[DEBUG] Pre-build state dump (Linux)'
        shell: bash
        run: |
          echo "========== PRE-BUILD STATE DUMP (Linux) =========="
          echo "pwd: $(pwd)"
          echo "PATINA_REPO=$PATINA_REPO"
          echo "  exists? $(test -d "$PATINA_REPO" && echo YES || echo NO)"
          echo "  Cargo.toml? $(test -f "$PATINA_REPO/Cargo.toml" && echo YES || echo NO)"
          echo "DEPS_DIR=$DEPS_DIR"
          echo "  exists? $(test -d "$DEPS_DIR" && echo YES || echo NO)"
          echo "FW_DIR=$FW_DIR"
          echo "  exists? $(test -d "$FW_DIR" && echo YES || echo NO)"
          echo ""
          echo "--- PATINA_REPO top-level ---"
          ls -la "$PATINA_REPO/" 2>&1 || echo '  (missing)'
          echo ""
          echo "--- FW_DIR listing ---"
          ls -laR "$FW_DIR/" 2>&1 | head -30 || echo '  (missing)'
          echo ""
          echo "--- DEPS_DIR listing ---"
          ls -la "$DEPS_DIR/" 2>&1 || echo '  (missing)'
          echo ""
          echo "--- /home/runner/work tree (depth 3) ---"
          find /home/runner/work -maxdepth 3 -type d 2>/dev/null | head -40 || true
          echo ""
          echo "--- All Cargo.toml files under /home/runner ---"
          find /home/runner -name 'Cargo.toml' 2>/dev/null || echo '  (none)'
          echo "================================================"

      - name: Setup and Build patina-dxe-core-qemu
        uses: makubacki/patina-devops/.github/actions/setup-patina-qemu-validation@patina_plat_testing
        with:
          patina-repo: ${{ env.PATINA_REPO }}
          deps-dir: ${{ env.DEPS_DIR }}
          dxe-core-qemu-repo: ${{ env.DXE_CORE_QEMU_REPO }}
          fw-patcher-repo: ${{ env.FW_PATCHER_REPO }}
          patina-qemu-repo: ${{ env.PATINA_QEMU_REPO }}
          log-file: ${{ env.LOG_DIR }}/${{ matrix.log_file }}

      - name: Run QEMU Validation - ${{ matrix.platform }} (Linux)
        uses: makubacki/patina-devops/.github/actions/run-patina-qemu-validation@patina_plat_testing
        with:
          patina-qemu-repo: ${{ env.PATINA_QEMU_REPO }}
          patina-dxe-core-repo: ${{ env.DXE_CORE_QEMU_REPO }}
          fw-patch-repo: ${{ env.FW_PATCHER_REPO }}
          pre-compiled-rom: ${{ env.FW_DIR }}/${{ matrix.rom_subpath }}
          toolchain: ${{ needs.vars.outputs['linux-toolchain'] }}
          platform: ${{ matrix.platform }}
          log-file: ${{ env.LOG_DIR }}/${{ matrix.log_file }}
          headless: 'true'
          no-build: 'true'
          shutdown-after-run: 'true'

      - name: Upload QEMU Linux ${{ matrix.platform }} Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-validation-logs-${{ runner.os }}-${{ matrix.platform }}
          path: ${{ env.LOG_DIR }}/*
          if-no-files-found: warn

  validate-qemu-windows:
    name: Validate QEMU Q35 (Windows)
    runs-on: windows-latest
    needs: [vars, readiness, release-assets]

    # -------------------------------------------------------------------
    # Directory layout (mirrors linux job — all absolute, all defined here)
    # -------------------------------------------------------------------
    env:
      PATINA_REPO:         ${{ github.workspace }}
      DEPS_DIR:            ${{ github.workspace }}/../deps
      DXE_CORE_QEMU_REPO:  ${{ github.workspace }}/../deps/patina-dxe-core-qemu
      FW_PATCHER_REPO:     ${{ github.workspace }}/../deps/patina-fw-patcher
      PATINA_QEMU_REPO:    ${{ github.workspace }}/../deps/patina-qemu
      FW_DIR:              ${{ github.workspace }}/firmware
      LOG_DIR:             ${{ github.workspace }}/logs

    steps:
      - name: Checkout patina
        uses: actions/checkout@v6
        with:
          repository: OpenDevicePartnership/patina
          ref: ${{ inputs.patina-ref }}

      - name: '[DEBUG] Post-checkout path dump (Windows)'
        shell: pwsh
        run: |
          Write-Host "========== WINDOWS POST-CHECKOUT DEBUG =========="
          Write-Host "github.workspace   = ${{ github.workspace }}"
          Write-Host "GITHUB_WORKSPACE   = $env:GITHUB_WORKSPACE"
          Write-Host "pwd                = $(Get-Location)"
          Write-Host "PATINA_REPO        = $env:PATINA_REPO"
          Write-Host "DEPS_DIR           = $env:DEPS_DIR"
          Write-Host "DXE_CORE_QEMU_REPO = $env:DXE_CORE_QEMU_REPO"
          Write-Host "FW_PATCHER_REPO    = $env:FW_PATCHER_REPO"
          Write-Host "PATINA_QEMU_REPO   = $env:PATINA_QEMU_REPO"
          Write-Host "FW_DIR             = $env:FW_DIR"
          Write-Host "LOG_DIR            = $env:LOG_DIR"
          Write-Host ""
          Write-Host "--- Cargo.toml in PATINA_REPO? ---"
          Test-Path "$env:PATINA_REPO\Cargo.toml"
          Write-Host ""
          Write-Host "--- ls PATINA_REPO (top-level) ---"
          if (Test-Path $env:PATINA_REPO) { Get-ChildItem $env:PATINA_REPO | Format-Table Name, Length -AutoSize } else { Write-Host '  (does not exist)' }
          Write-Host ""
          Write-Host "--- ls github.workspace (top-level) ---"
          if (Test-Path $env:GITHUB_WORKSPACE) { Get-ChildItem $env:GITHUB_WORKSPACE | Format-Table Name, Length -AutoSize } else { Write-Host '  (does not exist)' }
          Write-Host ""
          Write-Host "--- Cargo.toml search under D:\a ---"
          Get-ChildItem -Path D:\a -Recurse -Filter 'Cargo.toml' -Depth 4 -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "================================================"

      - name: Create directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:DEPS_DIR" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:FW_DIR" -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:LOG_DIR" -Force | Out-Null

      - name: Setup Python (Windows)
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.vars.outputs['python-version'] }}

      - name: Download Rust Tools
        uses: makubacki/patina-devops/.github/actions/rust-tool-cache@patina_plat_testing

      - name: '[DEBUG] Post Rust tool cache (Windows)'
        shell: pwsh
        run: |
          Write-Host "========== POST RUST TOOL CACHE (Windows) =========="
          Write-Host "rustup home:       $(rustup show home 2>$null)"
          Write-Host "CARGO_HOME:        $env:CARGO_HOME"
          Write-Host "rustup toolchain:  $(rustup show active-toolchain 2>$null)"
          Write-Host "cargo:             $(Get-Command cargo -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "cargo-make:        $(Get-Command cargo-make -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "cargo version:     $(cargo --version 2>$null)"
          Write-Host ""
          Write-Host "--- pwd ---"
          Get-Location
          Write-Host "--- PATINA_REPO still intact? ---"
          Write-Host "  Cargo.toml? $(Test-Path '$env:PATINA_REPO\Cargo.toml')"
          if (Test-Path $env:PATINA_REPO) { Get-ChildItem $env:PATINA_REPO | Select-Object -First 20 | Format-Table Name -AutoSize } else { Write-Host '  (missing)' }
          Write-Host "================================================"

      - name: Check Cache For patina-qemu FW Binaries
        id: firmware-cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/patina-qemu/q35.zip
            .cache/patina-qemu/sbsa.zip
          key: patina-qemu-fw-${{ runner.os }}-${{ needs.release-assets.outputs.tag }}

      - name: Download patina-qemu FW binaries
        if: steps.firmware-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .cache\patina-qemu -Force | Out-Null
          Invoke-WebRequest -Uri "${{ needs.release-assets.outputs.q35_url }}" -OutFile ".cache\patina-qemu\q35.zip"
          Invoke-WebRequest -Uri "${{ needs.release-assets.outputs.sbsa_url }}" -OutFile ".cache\patina-qemu\sbsa.zip"

      - name: Extract patina-qemu FW binaries
        shell: pwsh
        run: |
          Expand-Archive -Path .cache\patina-qemu\q35.zip -DestinationPath "$env:FW_DIR" -Force
          Expand-Archive -Path .cache\patina-qemu\sbsa.zip -DestinationPath "$env:FW_DIR" -Force

      - name: '[DEBUG] Pre-build state dump (Windows)'
        shell: pwsh
        run: |
          Write-Host "========== PRE-BUILD STATE DUMP (Windows) =========="
          Write-Host "pwd: $(Get-Location)"
          Write-Host "PATINA_REPO=$env:PATINA_REPO"
          Write-Host "  exists? $(Test-Path $env:PATINA_REPO)"
          Write-Host "  Cargo.toml? $(Test-Path (Join-Path $env:PATINA_REPO 'Cargo.toml'))"
          Write-Host "DEPS_DIR=$env:DEPS_DIR"
          Write-Host "  exists? $(Test-Path $env:DEPS_DIR)"
          Write-Host "FW_DIR=$env:FW_DIR"
          Write-Host "  exists? $(Test-Path $env:FW_DIR)"
          Write-Host ""
          Write-Host "--- PATINA_REPO top-level ---"
          if (Test-Path $env:PATINA_REPO) { Get-ChildItem $env:PATINA_REPO | Format-Table Name, Length -AutoSize } else { Write-Host '  (missing)' }
          Write-Host ""
          Write-Host "--- FW_DIR listing ---"
          if (Test-Path $env:FW_DIR) { Get-ChildItem $env:FW_DIR -Recurse | Select-Object -First 30 | Format-Table FullName -AutoSize } else { Write-Host '  (missing)' }
          Write-Host ""
          Write-Host "--- DEPS_DIR listing ---"
          if (Test-Path $env:DEPS_DIR) { Get-ChildItem $env:DEPS_DIR | Format-Table Name -AutoSize } else { Write-Host '  (missing)' }
          Write-Host ""
          Write-Host "--- All Cargo.toml under D:\a ---"
          Get-ChildItem -Path D:\a -Recurse -Filter 'Cargo.toml' -Depth 5 -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "================================================"

      - name: Setup and Build patina-dxe-core-qemu
        uses: makubacki/patina-devops/.github/actions/setup-patina-qemu-validation@patina_plat_testing
        with:
          patina-repo: ${{ env.PATINA_REPO }}
          deps-dir: ${{ env.DEPS_DIR }}
          dxe-core-qemu-repo: ${{ env.DXE_CORE_QEMU_REPO }}
          fw-patcher-repo: ${{ env.FW_PATCHER_REPO }}
          patina-qemu-repo: ${{ env.PATINA_QEMU_REPO }}
          log-file: ${{ env.LOG_DIR }}/q35-windows.log

      - name: Resolve Windows QEMU Package
        id: windows-qemu
        shell: pwsh
        run: |
          $yamlPath = Join-Path $env:RUNNER_TEMP "qemu-windows_ext_dep.yaml"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/OpenDevicePartnership/patina-qemu/refs/heads/main/QemuPkg/Binaries/qemu-windows_ext_dep.yaml" -OutFile $yamlPath
          $text = Get-Content -Path $yamlPath -Raw
          $zipUrl = ([regex]::Match($text, 'https?://[^\s\"\'']+\.zip')).Value
          if (-not $zipUrl) { throw "Unable to find QEMU zip URL in qemu-windows_ext_dep.yaml" }
          "zip-url=$zipUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache Windows QEMU Package
        id: qemu-cache
        uses: actions/cache@v5
        with:
          path: .cache/qemu/windows-qemu.zip
          key: windows-qemu-${{ steps.windows-qemu.outputs.zip-url }}

      - name: Download Windows QEMU Package
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .cache\qemu -Force | Out-Null
          Invoke-WebRequest -Uri "${{ steps.windows-qemu.outputs.zip-url }}" -OutFile ".cache\qemu\windows-qemu.zip"

      - name: Extract Windows QEMU and Update PATH
        id: qemu-path
        shell: pwsh
        run: |
          Expand-Archive -Path ".cache\qemu\windows-qemu.zip" -DestinationPath ".cache\qemu\windows" -Force
          $exe = Get-ChildItem -Path ".cache\qemu\windows" -Filter "qemu-system-x86_64.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "qemu-system-x86_64.exe not found after extracting Windows QEMU package" }
          $dir = $exe.DirectoryName
          # build_and_run_rust_binary.py --qemu-path expects the path to the
          # executable (not the directory). Strip the .exe extension to match
          # the script's default path convention.
          $exePath = [System.IO.Path]::ChangeExtension($exe.FullName, $null).TrimEnd('.')
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "qemu_exec=$exePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run QEMU Validation - Q35 (Windows)
        uses: makubacki/patina-devops/.github/actions/run-patina-qemu-validation@patina_plat_testing
        with:
          patina-qemu-repo: ${{ env.PATINA_QEMU_REPO }}
          patina-dxe-core-repo: ${{ env.DXE_CORE_QEMU_REPO }}
          fw-patch-repo: ${{ env.FW_PATCHER_REPO }}
          pre-compiled-rom: ${{ env.FW_DIR }}/Q35/DEBUG-VS2022/QEMUQ35_CODE.fd
          qemu-path: ${{ steps.qemu-path.outputs.qemu_exec }}
          toolchain: ${{ needs.vars.outputs['windows-toolchain'] }}
          platform: Q35
          log-file: ${{ env.LOG_DIR }}/q35-windows.log
          headless: 'true'
          no-build: 'true'
          shutdown-after-run: 'true'

      - name: Upload QEMU Windows Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-validation-logs-${{ runner.os }}
          path: ${{ env.LOG_DIR }}/*
          if-no-files-found: warn

  emit-pr-metadata:
    name: Emit PR Metadata
    runs-on: ubuntu-latest
    needs: [readiness, validate-qemu-linux, validate-qemu-windows]
    if: always()
    steps:
      - name: Write PR metadata
        shell: bash
        run: |
          mkdir -p metadata
          python - <<'PY'
          import json
          import pathlib

          readiness_result = '${{ needs.readiness.result }}'
          linux_result = '${{ needs.validate-qemu-linux.result }}'
          windows_result = '${{ needs.validate-qemu-windows.result }}'

          metadata = {
              'pr_number': ${{ inputs.pr-number }},
              'patina_ref': '${{ inputs.patina-ref }}',
              'readiness': {
                  'job_result': readiness_result,
                  'mismatch': '${{ needs.readiness.outputs.mismatch }}',
                  'patina_local_version': '${{ needs.readiness.outputs.patina_local_version }}',
                  'patina_local_major': '${{ needs.readiness.outputs.patina_local_major }}',
                  'patina_latest_tag': '${{ needs.readiness.outputs.patina_latest_tag }}',
                  'patina_latest_major_tag': '${{ needs.readiness.outputs.patina_latest_major_tag }}',
                  'patina_dxe_core_qemu_dep_version': '${{ needs.readiness.outputs.patina_dxe_core_qemu_dep_version }}',
                  'patina_dxe_core_qemu_dep_major': '${{ needs.readiness.outputs.patina_dxe_core_qemu_dep_major }}'
              },
              'validation': {
                  'linux_result': linux_result,
                  'windows_result': windows_result,
                  'failed': (
                      linux_result not in ('success', 'skipped') or
                      windows_result not in ('success', 'skipped') or
                      readiness_result != 'success'
                  )
              }
          }

          output_path = pathlib.Path('metadata/pr-metadata.json')
          output_path.write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          PY

      - name: Upload PR metadata artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: patina-qemu-pr-metadata
          path: metadata/pr-metadata.json
          if-no-files-found: error
